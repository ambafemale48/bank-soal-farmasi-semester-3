<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Bank Soal Farmasi Semester 3 — Farmasi UGM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"

    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-alt: #f2f6f2;
        --text: #1c2420;
        --dim: #5c6b5e;
        --border: #e2e8e2;
        --accent: #14532d;
        --accent-hover: #0e4023;
        --accent-text: #ffffff;
        --amber: #b45309;
        --amber-bg: #fdf6ec;
        --danger: #b91c1c;
        --danger-bg: #fdf0f0;
        --ok: #15803d;
        --ok-bg: #eef7f0;
        --radius: 16px;
      }
      * { box-sizing: border-box; }
      html, body { background: #ffffff; }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, [role="button"], select, summary,
      input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; font-size: 1rem; color: var(--text); }
      button:focus-visible, input:focus-visible, select:focus-visible,
      textarea:focus-visible, a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap { max-width: 48rem; margin: 0 auto; padding: 1.25rem 1rem 7rem; }
      h1 { font-size: 1.875rem; font-weight: 800; line-height: 1.2; margin: 0.25rem 0 0; letter-spacing: -0.01em; }
      h1.page { font-size: 1.5rem; }
      h2 { font-size: 1.125rem; font-weight: 700; margin: 0; }
      .dim { color: var(--dim); }
      .small { font-size: 0.875rem; }
      .xs { font-size: 0.75rem; }
      .mt1 { margin-top: 0.25rem; } .mt2 { margin-top: 0.5rem; } .mt3 { margin-top: 0.75rem; }
      .mt4 { margin-top: 1rem; } .mt5 { margin-top: 1.25rem; } .mt6 { margin-top: 1.5rem; } .mt8 { margin-top: 2rem; }

      .card {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: var(--radius);
      }
      .chip {
        display: inline-block; border: 1px solid var(--border); color: var(--dim);
        border-radius: 999px; padding: 0.125rem 0.55rem; font-size: 0.75rem; font-weight: 500;
        max-width: 100%; overflow-wrap: anywhere;
      }
      .chip.amber { color: var(--amber); border-color: var(--amber); }
      .chip.danger { color: var(--danger); border-color: var(--danger); }
      .chip.ok { color: var(--ok); border-color: var(--ok); }
      .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }

      .btn {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: 0.75rem; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600;
      }
      .btn-accent {
        background: var(--accent); border-color: var(--accent); color: var(--accent-text);
      }
      .btn-accent:hover { background: var(--accent-hover); }
      .btn-danger-o { border-color: var(--danger); color: var(--danger); background: var(--surface); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn-big {
        width: 100%; border-radius: var(--radius); padding: 0.875rem 1rem;
        font-size: 1.125rem; font-weight: 800; transition: transform 0.05s ease;
      }
      .btn-big:active { transform: scale(0.99); }

      .pill {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: 999px; padding: 0.5rem 0.875rem; font-size: 0.875rem; font-weight: 600;
      }
      .pill[aria-pressed="true"] {
        border-color: var(--accent); background: var(--accent); color: var(--accent-text);
      }
      .pillrow { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
      .countbtn {
        min-width: 3.5rem; border: 1px solid var(--border); background: var(--surface);
        border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 700;
      }
      .countbtn[aria-pressed="true"] {
        border-color: var(--accent); background: var(--accent); color: var(--accent-text);
      }
      .modegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
      .modebtn {
        border: 1px solid var(--border); background: var(--surface); border-radius: 0.75rem;
        padding: 0.75rem; text-align: left;
      }
      .modebtn[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-alt); }
      .modebtn .t { font-weight: 700; }
      .modebtn .d { display: block; margin-top: 0.125rem; font-size: 0.75rem; color: var(--dim); }

      .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-top: 1.25rem; }
      .stat { text-align: center; padding: 0.75rem; }
      .stat .n { font-size: 1.5rem; font-weight: 800; }
      .stat .l { font-size: 0.75rem; color: var(--dim); }

      .wrongbtn {
        margin-top: 0.75rem; display: flex; width: 100%; align-items: center; justify-content: space-between;
        border: 1px solid var(--amber); background: var(--surface); color: var(--amber);
        border-radius: var(--radius); padding: 0.75rem 1rem; font-weight: 600; text-align: left; font-size: 1rem;
      }
      .bar { margin-top: 0.5rem; height: 0.5rem; border-radius: 999px; background: var(--surface-alt); overflow: hidden; }
      .bar > div { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.5s ease; }
      .subjcard { padding: 0.875rem; }
      .subjhead { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
      .subjhead .nm { font-weight: 700; }
      .stack > * + * { margin-top: 0.75rem; }
      .histrow {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.625rem 0.875rem;
      }
      .histrow .sc { font-weight: 800; }

      .field {
        width: 100%; border: 1px solid var(--border); background: var(--surface);
        border-radius: 0.75rem; padding: 0.625rem 0.875rem;
      }
      .filtergrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
      label.flabel { display: block; margin-top: 1rem; font-size: 0.875rem; font-weight: 700; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      .qcard { overflow: hidden; }
      .qhead { width: 100%; background: none; border: 0; padding: 0.875rem 1rem; text-align: left; }
      .qstem { display: block; margin-top: 0.5rem; font-weight: 600; line-height: 1.45; }
      .qbody { border-top: 1px solid var(--border); padding: 0.875rem 1rem; }
      .optlist { list-style: none; margin: 0; padding: 0; }
      .optlist li {
        border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.75rem;
        font-size: 0.875rem; margin-top: 0.375rem;
      }
      .optlist li:first-child { margin-top: 0; }
      .optlist li.key { border-color: var(--ok); background: var(--surface-alt); font-weight: 600; }
      .explain {
        margin-top: 0.75rem; background: var(--surface-alt); border-radius: 0.75rem; padding: 0.75rem;
      }
      .explain .h {
        font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.05em; color: var(--accent); margin: 0;
      }
      .explain p { margin: 0.25rem 0 0; font-size: 0.875rem; line-height: 1.6; }
      .keypoint {
        margin-top: 0.5rem; border-left: 4px solid var(--amber); padding-left: 0.625rem;
        font-size: 0.875rem; font-weight: 600;
      }
      .qactions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
      .empty {
        margin-top: 2rem; border: 1px dashed var(--border); border-radius: var(--radius);
        padding: 1.5rem; text-align: center;
      }

      .sesshead { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
      .qbig { padding: 1.25rem; border-radius: 1.5rem; margin-top: 1rem; }
      .qbig h2 { font-size: 1.125rem; line-height: 1.45; margin-top: 0.75rem; }
      .optbtn {
        display: flex; width: 100%; align-items: flex-start; gap: 0.75rem;
        border: 2px solid var(--border); background: var(--surface); border-radius: var(--radius);
        padding: 0.75rem 1rem; text-align: left; font-weight: 500; font-size: 1rem;
        margin-top: 0.5rem; transition: transform 0.05s ease;
      }
      .optbtn:active { transform: scale(0.99); }
      .optbtn:disabled { cursor: default; }
      .optbtn .letter {
        display: flex; height: 1.75rem; width: 1.75rem; flex-shrink: 0; align-items: center;
        justify-content: center; border-radius: 999px; border: 1px solid var(--border);
        font-weight: 800; color: var(--dim);
      }
      .optbtn .txt { padding-top: 0.125rem; line-height: 1.4; }
      .optbtn .mark { margin-left: auto; padding-top: 0.125rem; font-weight: 700; }
      .optbtn.sel { border-color: var(--accent); background: var(--surface-alt); }
      .optbtn.sel .letter { border-color: var(--accent); color: var(--accent); }
      .optbtn.key { border-color: var(--ok); background: var(--surface-alt); }
      .optbtn.key .letter { border-color: var(--ok); color: var(--ok); }
      .optbtn.wrong { border-color: var(--danger); background: var(--surface-alt); }
      .optbtn.wrong .letter { border-color: var(--danger); color: var(--danger); }
      .feedback { margin-top: 1rem; border: 2px solid var(--border); background: var(--surface-alt); border-radius: var(--radius); padding: 1rem; }
      .feedback.ok { border-color: var(--ok); }
      .feedback.bad { border-color: var(--danger); }
      .feedback .verdict { font-size: 1.125rem; font-weight: 800; }
      .feedback .verdict.ok { color: var(--ok); }
      .feedback .verdict.bad { color: var(--danger); }
      .sessnav { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
      .sessnav .grow { flex: 1; }
      .sessnav button { padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 1rem; }

      .result { margin-top: 1rem; border-radius: 1.5rem; padding: 1.5rem; text-align: center; }
      .result .pct { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
      .bedah { padding: 1rem; }
      .bedah .stem { margin-top: 0.5rem; font-weight: 600; line-height: 1.45; }

      .aisec { margin-top: 1.25rem; border: 1px solid var(--amber); border-radius: 1.5rem; padding: 1.25rem; }
      .btn-amber {
        width: 100%; margin-top: 1rem; border: 1px solid var(--amber); background: var(--amber);
        color: #ffffff; border-radius: var(--radius); padding: 0.75rem 1rem; font-weight: 800; font-size: 1rem;
      }
      .btn-amber:disabled { opacity: 0.6; }
      .optrow { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
      .optrow input[type="radio"] { height: 1.25rem; width: 1.25rem; flex-shrink: 0; accent-color: #14532d; }
      .optrow .ltr { font-weight: 800; }
      .msg-err { color: var(--danger); font-size: 0.875rem; font-weight: 500; margin-top: 0.75rem; }
      .msg-ok { color: var(--ok); font-size: 0.875rem; font-weight: 500; margin-top: 0.75rem; }
      .msg-info { color: var(--accent); font-size: 0.875rem; font-weight: 500; margin-top: 0.75rem; }

      .tools { margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
      .tools .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

      footer.credit { margin-top: 3rem; border-top: 1px solid var(--border); padding: 1.5rem 0 0.5rem; text-align: center; }
      footer.credit .pre {
        font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.18em; color: var(--dim); margin: 0;
      }
      footer.credit .by { margin: 0.375rem 0 0; font-size: 1rem; color: var(--dim); }
      footer.credit .by strong { font-size: 1.125rem; font-weight: 800; letter-spacing: -0.01em; color: var(--accent); }
      footer.credit .sub { margin: 0.25rem 0 0; font-size: 0.75rem; color: var(--dim); }

      nav.tabbar {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
        border-top: 1px solid var(--border); background: var(--surface);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.tabbar .grid { max-width: 48rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
      nav.tabbar button {
        display: flex; flex-direction: column; align-items: center; gap: 0.125rem;
        padding: 0.625rem 0.25rem; background: none; border: 0;
        font-size: 0.75rem; font-weight: 600; color: var(--dim); min-height: 3rem;
      }
      nav.tabbar button[aria-current="page"] { color: var(--accent); }
      nav.tabbar .ic { font-size: 1.125rem; line-height: 1; }
      .hidden { display: none !important; }
      .subject-select { display: none; }
      @media (max-width: 640px) {
        /* Di layar sempit, nama mata kuliah panjang membuat deretan pill
           sangat tinggi — pakai pemilih ringkas agar tombol sesi tidak
           tertutup bilah navigasi bawah. */
        .pillrow.subjects { display: none; }
        .subject-select { display: block; margin-top: 0.5rem; }
        .wrap { padding-top: 1rem; }
        h1 { font-size: 1.75rem; }
        .stat { padding: 0.5rem 0.25rem; }
        .stat .n { font-size: 1.3rem; }
        .statgrid { margin-top: 1rem; gap: 0.5rem; }
      }
      @media (max-width: 420px) {
        .subjhead { flex-direction: column; gap: 0.125rem; }
      }
    </style>
  </head>
  <body>
    <main class="wrap" id="app" aria-live="off"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navigasi utama">

        <button type="button" data-nav="beranda"><span class="ic" aria-hidden="true">🏠</span>Beranda</button>

    <script>
      "use strict";
      /* Bank soal awal: 60 soal untuk mahasiswa Farmasi UGM semester 3
         (Kurikulum 2022), berporos pada tiga praktikum semester III —
         FAF221302, FAF221305, FAF221307 — plus Biokimia, Mikrobiologi
         Farmasi, Farmakognosi, dan Farmasi Fisika. Disusun dari konsep
         inti buku teks standar (Farmakope Indonesia, Goodman & Gilman,
         Katzung, Aulton, Sinko, Jawetz); soal latihan susunan sendiri,
         bukan soal ujian resmi UGM. */
      const SEED =
[{"id": 1, "code": "FK-01", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakokinetik", "difficulty": "Mudah", "stem": "Bioavailabilitas suatu obat yang diberikan secara intravena (IV) adalah…", "options": ["100%, karena obat langsung masuk ke sirkulasi sistemik", "50%, karena sebagian obat terikat protein plasma", "Bergantung pada efek lintas pertama (first-pass effect) di hati", "0%, karena obat IV tidak mengalami absorpsi sama sekali"], "answerIndex": 0, "explanation": "Pemberian IV memasukkan obat langsung ke dalam sirkulasi sistemik sehingga tidak ada tahap absorpsi dan tidak ada metabolisme lintas pertama. Karena seluruh dosis mencapai sirkulasi, bioavailabilitasnya didefinisikan sebagai 100% (F = 1) dan menjadi pembanding bagi rute pemberian lain.", "keyPoint": "Rute IV → bioavailabilitas selalu 100%.", "source": "bank"}, {"id": 2, "code": "FK-02", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakokinetik", "difficulty": "Sedang", "stem": "Efek lintas pertama (first-pass effect) paling besar pengaruhnya pada obat yang diberikan melalui rute…", "options": ["Intravena", "Oral", "Transdermal", "Sublingual"], "answerIndex": 1, "explanation": "Obat oral yang diserap dari saluran cerna dialirkan lewat vena porta ke hati sebelum mencapai sirkulasi sistemik, sehingga sebagian obat sudah dimetabolisme di dinding usus dan hati. Rute IV melewati proses ini, sedangkan sublingual dan transdermal juga menghindari vena porta sehingga first-pass effect-nya kecil.", "keyPoint": "First-pass effect terutama masalah pada obat oral.", "source": "bank"}, {"id": 3, "code": "FK-03", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakodinamik", "difficulty": "Sedang", "stem": "Penambahan antagonis kompetitif terhadap suatu agonis akan mengubah kurva dosis–respons agonis menjadi…", "options": ["Bergeser ke kiri tanpa mengubah respons maksimal", "Bergeser ke kanan tanpa mengubah respons maksimal", "Bergeser ke kanan dan respons maksimal menurun", "Respons maksimal naik tanpa pergeseran kurva"], "answerIndex": 1, "explanation": "Antagonis kompetitif berikatan reversibel pada sisi aktif reseptor yang sama dengan agonis. Karena ikatannya dapat disaingi, menaikkan konsentrasi agonis dapat mengembalikan respons maksimal (Emaks tetap), tetapi dibutuhkan dosis agonis yang lebih besar sehingga kurva bergeser sejajar ke kanan dan EC50 meningkat.", "keyPoint": "Antagonis kompetitif: kurva geser kanan, Emaks tetap.", "source": "bank"}, {"id": 4, "code": "FK-04", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakodinamik", "difficulty": "Mudah", "stem": "Senyawa yang berikatan pada reseptor tetapi tidak menimbulkan respons, dan justru menghambat kerja agonis, disebut…", "options": ["Agonis penuh", "Agonis parsial", "Antagonis", "Agonis invers"], "answerIndex": 2, "explanation": "Antagonis memiliki afinitas terhadap reseptor tetapi efikasi intrinsiknya nol, sehingga tidak menimbulkan respons dan mencegah agonis bekerja. Agonis parsial tetap menimbulkan respons submaksimal, sedangkan agonis invers menurunkan aktivitas konstitutif reseptor.", "keyPoint": "Afinitas ada, efikasi nol → antagonis.", "source": "bank"}, {"id": 5, "code": "FK-05", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakokinetik", "difficulty": "Sedang", "stem": "Konsentrasi tunak (steady state) pada pemberian obat berulang dengan dosis tetap umumnya tercapai setelah…", "options": ["1 kali waktu paruh", "2 kali waktu paruh", "4–5 kali waktu paruh", "10 kali waktu paruh"], "answerIndex": 2, "explanation": "Pada eliminasi orde satu, setiap waktu paruh menutup sekitar 50% sisa jarak menuju konsentrasi tunak: setelah 4 waktu paruh tercapai ±94% dan setelah 5 waktu paruh ±97%, yang secara klinis dianggap sudah tunak. Prinsip yang sama berlaku sebaliknya: obat hampir seluruhnya tereliminasi setelah 4–5 waktu paruh sejak pemberian dihentikan.", "keyPoint": "Steady state ≈ 4–5 × t½.", "source": "bank"}, {"id": 6, "code": "FK-06", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakokinetik", "difficulty": "Sulit", "stem": "Obat dengan volume distribusi (Vd) yang sangat besar menunjukkan bahwa obat tersebut…", "options": ["Sebagian besar tetap berada di dalam plasma darah", "Banyak terdistribusi dan terikat di jaringan di luar plasma", "Cepat diekskresikan melalui ginjal", "Tidak dapat menembus membran sel sama sekali"], "answerIndex": 1, "explanation": "Vd adalah volume semu yang menghubungkan jumlah obat dalam tubuh dengan konsentrasi plasma. Vd yang besar (jauh melampaui volume plasma, bahkan volume cairan tubuh total) berarti konsentrasi plasma rendah karena obat banyak keluar dari pembuluh darah dan terakumulasi/terikat di jaringan, misalnya obat sangat lipofilik atau terikat kuat pada jaringan.", "keyPoint": "Vd besar = obat banyak bersembunyi di jaringan.", "source": "bank"}, {"id": 7, "code": "FK-07", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakokinetik", "difficulty": "Sedang", "stem": "Pada kinetika eliminasi orde satu, yang terjadi adalah…", "options": ["Jumlah obat yang tereliminasi per satuan waktu selalu tetap", "Persentase (fraksi) obat yang tereliminasi per satuan waktu tetap", "Waktu paruh obat bertambah seiring naiknya dosis", "Eliminasi tidak bergantung pada konsentrasi obat"], "answerIndex": 1, "explanation": "Pada orde satu, laju eliminasi sebanding dengan konsentrasi: fraksi obat yang hilang per satuan waktu tetap, sehingga waktu paruh konstan berapa pun dosisnya. Sebaliknya pada orde nol (misalnya etanol dosis tinggi), jumlah yang tereliminasi per satuan waktu tetap karena enzim eliminasi jenuh.", "keyPoint": "Orde satu: fraksi tetap, t½ konstan.", "source": "bank"}, {"id": 8, "code": "FK-08", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Farmakodinamik", "difficulty": "Mudah", "stem": "Indeks terapi suatu obat dihitung dari perbandingan…", "options": ["Dosis efektif median (ED50) terhadap dosis letal median (LD50)", "Dosis toksik median (TD50) terhadap dosis efektif median (ED50)", "Konsentrasi plasma puncak terhadap konsentrasi minimum efektif", "Dosis muatan (loading dose) terhadap dosis pemeliharaan"], "answerIndex": 1, "explanation": "Indeks terapi = TD50/ED50 (pada hewan uji sering dipakai LD50/ED50). Semakin besar indeks terapi, semakin lebar jarak antara dosis yang bermanfaat dan dosis yang menimbulkan toksisitas, sehingga obat dinilai semakin aman. Obat seperti digoksin dan warfarin berindeks terapi sempit sehingga perlu pemantauan ketat.", "keyPoint": "Indeks terapi = TD50 ÷ ED50; makin besar makin aman.", "source": "bank"}, {"id": 9, "code": "FSP-01", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Granulasi", "difficulty": "Mudah", "stem": "Tujuan utama pembuatan granul sebelum pencetakan tablet adalah…", "options": ["Menutupi rasa pahit bahan aktif", "Memperbaiki sifat alir dan kompresibilitas massa tablet", "Mempercepat waktu hancur tablet di lambung", "Meningkatkan kelarutan bahan aktif dalam air"], "answerIndex": 1, "explanation": "Serbuk halus umumnya mengalir buruk dan sulit dikompresi merata, menyebabkan variasi bobot tablet. Granulasi menggumpalkan partikel menjadi granul yang lebih besar dan seragam sehingga aliran ke dalam die lancar dan tablet yang dicetak kompak serta seragam bobotnya.", "keyPoint": "Granulasi = memperbaiki aliran + kompresibilitas.", "source": "bank"}, {"id": 10, "code": "FSP-02", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Eksipien Tablet", "difficulty": "Mudah", "stem": "Bahan tambahan yang berfungsi membantu tablet hancur menjadi partikel kecil setelah kontak dengan cairan disebut…", "options": ["Pengikat (binder)", "Penghancur (disintegran)", "Pelincir (lubrikan)", "Pengisi (diluent)"], "answerIndex": 1, "explanation": "Disintegran bekerja dengan menyerap air dan mengembang (swelling) atau menimbulkan aksi kapiler sehingga tablet pecah menjadi granul dan partikel halus, mempercepat pelepasan zat aktif. Contohnya sodium starch glycolate (SSG) dan croscarmellose sodium. Pengikat justru menyatukan granul, lubrikan mengurangi gesekan saat pencetakan, dan pengisi menambah bobot massa tablet.", "keyPoint": "Disintegran memecah tablet; contoh: SSG, croscarmellose.", "source": "bank"}, {"id": 11, "code": "FSP-03", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Eksipien Tablet", "difficulty": "Sedang", "stem": "Magnesium stearat dalam formulasi tablet berfungsi sebagai lubrikan. Pemakaian yang berlebihan dapat menyebabkan…", "options": ["Tablet menjadi terlalu keras dan tidak hancur", "Terbentuk lapisan hidrofobik yang memperlambat disintegrasi dan disolusi", "Granul menjadi terlalu lembab dan lengket pada punch", "Bobot tablet menjadi tidak seragam"], "answerIndex": 1, "explanation": "Magnesium stearat bersifat hidrofobik. Bila kadarnya terlalu tinggi atau pencampuran terlalu lama, ia melapisi permukaan granul secara berlebihan sehingga air sulit membasahi tablet: waktu hancur dan laju disolusi menurun. Kadar lazimnya hanya 0,25–1% dan dicampurkan pada tahap akhir dalam waktu singkat.", "keyPoint": "Mg stearat berlebih → tablet sulit dibasahi, disolusi lambat.", "source": "bank"}, {"id": 12, "code": "FSP-04", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Evaluasi Tablet", "difficulty": "Sedang", "stem": "Uji kerapuhan (friability) tablet dengan friabilator umumnya dinyatakan memenuhi syarat apabila susut bobot…", "options": ["Tidak lebih dari 0,1%", "Tidak lebih dari 1%", "Tidak lebih dari 5%", "Tidak lebih dari 10%"], "answerIndex": 1, "explanation": "Uji friability menilai ketahanan permukaan tablet terhadap gesekan dan goncangan selama pengemasan dan distribusi. Tablet diputar dalam friabilator (25 rpm selama 4 menit = 100 putaran), lalu ditimbang kembali; syarat Farmakope adalah susut bobot tidak lebih dari 1% dan tidak ada tablet yang retak atau pecah.", "keyPoint": "Friability lulus bila susut bobot ≤ 1%.", "source": "bank"}, {"id": 13, "code": "FSP-05", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Evaluasi Tablet", "difficulty": "Sedang", "stem": "Menurut Farmakope Indonesia, waktu hancur tablet tidak bersalut dalam medium air umumnya tidak lebih dari…", "options": ["5 menit", "15 menit", "30 menit", "60 menit"], "answerIndex": 1, "explanation": "Uji waktu hancur menilai kemampuan tablet pecah dalam medium cair pada suhu 37 ± 2 °C. Untuk tablet tidak bersalut syaratnya tidak lebih dari 15 menit, sedangkan tablet salut gula umumnya ≤ 60 menit dan tablet salut enterik tidak boleh hancur di medium asam tetapi hancur di medium basa dalam batas waktunya.", "keyPoint": "Tablet tak bersalut: hancur ≤ 15 menit.", "source": "bank"}, {"id": 14, "code": "FSP-06", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Cacat Tablet", "difficulty": "Sedang", "stem": "Cacat tablet berupa terlepasnya bagian atas (tutup) tablet dari badan tablet disebut…", "options": ["Laminasi", "Capping", "Sticking", "Mottling"], "answerIndex": 1, "explanation": "Capping adalah lepasnya bagian atas atau bawah tablet secara horizontal, sering disebabkan udara yang terjebak saat kompresi, granul terlalu kering/halus, atau tekanan pencetakan dan kecepatan mesin yang tidak tepat. Laminasi adalah pemisahan tablet menjadi dua lapis atau lebih, sticking adalah melekatnya massa pada permukaan punch, dan mottling adalah warna tablet yang tidak merata.", "keyPoint": "Capping = tutup tablet terlepas.", "source": "bank"}, {"id": 15, "code": "FSP-07", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Eksipien Tablet", "difficulty": "Mudah", "stem": "Bahan pengisi (diluent) yang paling umum digunakan pada tablet dosis kecil adalah…", "options": ["Laktosa", "Talkum", "Magnesium stearat", "Aerosil"], "answerIndex": 0, "explanation": "Pengisi menambah volume massa tablet bila dosis zat aktif kecil agar tablet mudah dicetak dan ditangani. Laktosa paling lazim karena sifat alir dan kompresibilitasnya baik serta relatif inert. Talkum dan magnesium stearat adalah lubrikan/glidan, sedangkan aerosil (silika koloidal) berfungsi sebagai glidan penyerap kelembaban.", "keyPoint": "Pengisi klasik tablet: laktosa.", "source": "bank"}, {"id": 16, "code": "FSP-08", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Granulasi", "difficulty": "Sulit", "stem": "Metode cetak langsung (direct compression) paling cocok untuk zat aktif yang…", "options": ["Sangat higroskopis dan tidak stabil terhadap panas", "Memiliki sifat alir dan kompresibilitas yang baik serta dosis relatif besar", "Berdosis sangat kecil dan tidak larut air", "Harus digranulasi basah agar stabil"], "answerIndex": 1, "explanation": "Cetak langsung melewatkan tahap granulasi: serbuk dicampur lalu langsung dicetak. Metode ini cepat dan menghindari panas/lembab, tetapi menuntut bahan (dan pengisi khusus seperti laktosa spray-dried atau mikrokristalin selulosa) dengan aliran dan kompresibilitas baik. Zat berdosis sangat kecil berisiko tidak seragam kandungannya, sehingga granulasi sering lebih dipilih.", "keyPoint": "Cetak langsung menuntut serbuk yang mengalir & terkompresi baik.", "source": "bank"}, {"id": 17, "code": "KA-01", "subject": "Kimia Analisis II (FAF221307)", "topic": "Spektrofotometri UV-Vis", "difficulty": "Mudah", "stem": "Hukum Beer–Lambert menyatakan hubungan absorbansi (A) dengan konsentrasi (c) dan tebal kuvet (b) sebagai…", "options": ["A = ε · b · c", "A = ε + b + c", "A = ε / (b · c)", "A = b / (ε · c)"], "answerIndex": 0, "explanation": "Hukum Beer–Lambert: A = εbc, dengan ε = absorptivitas molar, b = tebal lapisan larutan (cm), dan c = konsentrasi. Artinya absorbansi berbanding lurus dengan konsentrasi pada tebal kuvet tetap — dasar pembuatan kurva kalibrasi pada spektrofotometri UV-Vis.", "keyPoint": "A = εbc; absorbansi ∝ konsentrasi.", "source": "bank"}, {"id": 18, "code": "KA-02", "subject": "Kimia Analisis II (FAF221307)", "topic": "Spektrofotometri UV-Vis", "difficulty": "Sedang", "stem": "Jika konsentrasi larutan analit digandakan (tebal kuvet tetap), maka absorbansinya akan…", "options": ["Tetap, karena absorbansi hanya ditentukan alat", "Menjadi dua kali lipat", "Menjadi setengahnya", "Naik empat kali lipat"], "answerIndex": 1, "explanation": "Sesuai A = εbc, pada b dan ε yang tetap, absorbansi berbanding lurus dengan konsentrasi. Konsentrasi dua kali lipat menghasilkan absorbansi dua kali lipat, selama masih berada dalam rentang linear alat (umumnya A ≈ 0,2–0,8 memberikan ketelitian terbaik).", "keyPoint": "Hubungan A–c linear pada rentang kerja alat.", "source": "bank"}, {"id": 19, "code": "KA-03", "subject": "Kimia Analisis II (FAF221307)", "topic": "Titrimetri", "difficulty": "Sedang", "stem": "Penetapan kadar kalsium dan magnesium (kesadahan air) secara titrimetri umumnya menggunakan titran…", "options": ["Asam klorida 0,1 N", "EDTA (dinatrium edetat)", "Perak nitrat", "Kalium permanganat"], "answerIndex": 1, "explanation": "EDTA membentuk kompleks khelat 1:1 yang stabil dengan ion logam seperti Ca²⁺ dan Mg²⁺, sehingga dipakai pada titrasi kompleksometri. Indikator yang lazim adalah Eriochrome Black T (EBT) pada pH ±10 (bufer amonia): warna berubah dari merah anggur (kompleks logam–indikator) menjadi biru (indikator bebas) pada titik akhir.", "keyPoint": "Kompleksometri: titran EDTA, indikator EBT.", "source": "bank"}, {"id": 20, "code": "KA-04", "subject": "Kimia Analisis II (FAF221307)", "topic": "Titrimetri", "difficulty": "Mudah", "stem": "Indikator fenolftalein pada titrasi asam–basa berubah warna pada rentang pH sekitar…", "options": ["3,1–4,4 (kuning ke merah)", "4,2–6,3 (merah ke kuning)", "6,2–7,6 (kuning ke biru)", "8,2–10,0 (tak berwarna ke merah muda)"], "answerIndex": 3, "explanation": "Fenolftalein tidak berwarna dalam suasana asam dan menjadi merah muda/ungu muda pada pH 8,2–10,0, sehingga cocok untuk titrasi asam lemah dengan basa kuat yang titik ekivalennya bersifat basa. Metil jingga berentang 3,1–4,4 dan metil merah 4,2–6,3, keduanya untuk titik akhir yang lebih asam.", "keyPoint": "Fenolftalein: pH 8,2–10, tak berwarna → merah muda.", "source": "bank"}, {"id": 21, "code": "KA-05", "subject": "Kimia Analisis II (FAF221307)", "topic": "Kromatografi", "difficulty": "Mudah", "stem": "Pada kromatografi lapis tipis (KLT), nilai Rf suatu noda didefinisikan sebagai…", "options": ["Jarak tempuh fase gerak dibagi jarak tempuh noda", "Jarak tempuh noda dibagi jarak tempuh fase gerak (garis depan pelarut)", "Jarak tempuh noda dikali jarak tempuh fase gerak", "Selisih jarak tempuh fase gerak dan noda"], "answerIndex": 1, "explanation": "Rf (retardation factor) = jarak yang ditempuh noda analit ÷ jarak yang ditempuh garis depan fase gerak, diukur dari garis awal yang sama. Nilainya selalu antara 0 dan 1 dan khas untuk suatu senyawa pada sistem fase diam–fase gerak tertentu, sehingga dipakai untuk identifikasi kualitatif.", "keyPoint": "Rf = jarak noda ÷ jarak pelarut (0–1).", "source": "bank"}, {"id": 22, "code": "KA-06", "subject": "Kimia Analisis II (FAF221307)", "topic": "Kromatografi", "difficulty": "Sedang", "stem": "Pada HPLC fase terbalik (reversed phase) yang paling umum digunakan, kombinasi fase diam dan fase geraknya adalah…", "options": ["Fase diam polar (silika), fase gerak nonpolar (heksana)", "Fase diam nonpolar (C18/ODS), fase gerak polar (air–metanol/asetonitril)", "Fase diam gas, fase gerak cairan", "Fase diam ion-exchange, fase gerak gas"], "answerIndex": 1, "explanation": "HPLC fase terbalik memakai fase diam nonpolar berupa silika yang dimodifikasi rantai oktadesil (C18/ODS) dan fase gerak polar seperti campuran air dengan metanol atau asetonitril. Senyawa yang lebih nonpolar tertahan lebih lama karena lebih kuat berinteraksi dengan fase diam. Kebalikannya, fase normal memakai fase diam polar dan fase gerak nonpolar.", "keyPoint": "Fase terbalik: C18 nonpolar + fase gerak polar.", "source": "bank"}, {"id": 23, "code": "KA-07", "subject": "Kimia Analisis II (FAF221307)", "topic": "Validasi Metode", "difficulty": "Sedang", "stem": "Perbedaan presisi dan akurasi dalam validasi metode analisis adalah…", "options": ["Presisi menilai kedekatan hasil dengan nilai sebenarnya; akurasi menilai kedekatan antarhasil berulang", "Presisi menilai kedekatan antarhasil pengukuran berulang; akurasi menilai kedekatan hasil dengan nilai sebenarnya", "Keduanya menilai hal yang sama, hanya istilahnya berbeda", "Presisi hanya untuk metode kualitatif; akurasi hanya untuk kuantitatif"], "answerIndex": 1, "explanation": "Presisi (kecermatan/keterulangan) menggambarkan seberapa dekat hasil-hasil pengukuran berulang satu sama lain, dinyatakan misalnya dengan simpangan baku relatif (%RSD). Akurasi (ketepatan) menggambarkan kedekatan hasil rata-rata terhadap nilai sebenarnya, dinyatakan misalnya dengan persen perolehan kembali (recovery). Metode yang baik harus presisi sekaligus akurat.", "keyPoint": "Presisi = antarhasil rapat; akurasi = dekat nilai benar.", "source": "bank"}, {"id": 24, "code": "KA-08", "subject": "Kimia Analisis II (FAF221307)", "topic": "Spektrofotometri UV-Vis", "difficulty": "Sulit", "stem": "Dalam pengukuran spektrofotometri, larutan blanko digunakan untuk…", "options": ["Menentukan panjang gelombang maksimum analit", "Mengoreksi serapan dari pelarut dan komponen matriks selain analit", "Menaikkan konsentrasi analit agar terbaca alat", "Mengkalibrasi timbangan analitik sebelum penimbangan"], "answerIndex": 1, "explanation": "Blanko berisi semua komponen sampel (pelarut, pereaksi) kecuali analit. Mengukur blanko dan menjadikannya acuan nol absorbansi memastikan sinyal yang terbaca pada sampel hanya berasal dari analit, bukan dari serapan pelarut, kuvet, atau pereaksi pembentuk warna.", "keyPoint": "Blanko = koreksi serapan selain analit.", "source": "bank"}, {"id": 25, "code": "BK-01", "subject": "Biokimia", "topic": "Enzim", "difficulty": "Mudah", "stem": "Enzim mempercepat reaksi biokimia dengan cara…", "options": ["Menaikkan energi aktivasi reaksi", "Menurunkan energi aktivasi reaksi", "Mengubah kesetimbangan reaksi ke arah produk", "Menaikkan suhu sel secara lokal"], "answerIndex": 1, "explanation": "Enzim adalah biokatalis: ia menyediakan jalur reaksi alternatif dengan energi aktivasi lebih rendah sehingga reaksi mencapai kesetimbangan lebih cepat. Enzim tidak mengubah ΔG maupun posisi kesetimbangan, dan tidak ikut habis dalam reaksi.", "keyPoint": "Enzim menurunkan energi aktivasi, bukan mengubah kesetimbangan.", "source": "bank"}, {"id": 26, "code": "BK-02", "subject": "Biokimia", "topic": "Enzim", "difficulty": "Sulit", "stem": "Pada inhibisi kompetitif, pengaruh inhibitor terhadap parameter kinetika enzim adalah…", "options": ["Km meningkat, Vmaks tetap", "Km tetap, Vmaks menurun", "Km dan Vmaks sama-sama menurun", "Km menurun, Vmaks meningkat"], "answerIndex": 0, "explanation": "Inhibitor kompetitif bersaing dengan substrat memperebutkan sisi aktif enzim. Akibatnya afinitas semu enzim terhadap substrat menurun (Km naik), tetapi pada konsentrasi substrat sangat tinggi inhibitor dapat disaingi habis sehingga Vmaks tetap tercapai. Pada inhibisi nonkompetitif, inhibitor berikatan di sisi lain sehingga Vmaks turun dan Km umumnya tetap.", "keyPoint": "Kompetitif: Km ↑, Vmaks tetap.", "source": "bank"}, {"id": 27, "code": "BK-03", "subject": "Biokimia", "topic": "Metabolisme Karbohidrat", "difficulty": "Sedang", "stem": "Hasil bersih (netto) ATP dari glikolisis satu molekul glukosa di sitoplasma adalah…", "options": ["2 ATP", "4 ATP", "8 ATP", "38 ATP"], "answerIndex": 0, "explanation": "Glikolisis menghasilkan 4 ATP melalui fosforilasi tingkat substrat, tetapi 2 ATP dipakai pada tahap awal (heksokinase dan fosfofruktokinase), sehingga hasil bersihnya 2 ATP ditambah 2 NADH. Angka ±30–32 ATP adalah hasil total respirasi aerob lengkap sampai rantai transport elektron, bukan glikolisis saja.", "keyPoint": "Glikolisis netto: 2 ATP + 2 NADH per glukosa.", "source": "bank"}, {"id": 28, "code": "BK-04", "subject": "Biokimia", "topic": "Vitamin & Darah", "difficulty": "Sedang", "stem": "Defisiensi vitamin B12 dan/atau asam folat menyebabkan anemia megaloblastik karena keduanya berperan penting dalam…", "options": ["Sintesis hemoglobin pada sitoplasma eritrosit", "Sintesis DNA yang diperlukan untuk pembelahan sel darah merah", "Penyerapan zat besi di usus", "Pengaktifan faktor pembekuan darah"], "answerIndex": 1, "explanation": "Folat dan vitamin B12 diperlukan untuk sintesis nukleotida (terutama timidilat) sehingga sel yang cepat membelah, termasuk prekursor eritrosit di sumsum tulang, dapat memperbanyak DNA. Kekurangannya membuat pembelahan inti tertinggal dibanding pematangan sitoplasma, menghasilkan sel darah merah besar yang belum matang (megaloblas).", "keyPoint": "B12/folat kurang → sintesis DNA terganggu → anemia megaloblastik.", "source": "bank"}, {"id": 29, "code": "BK-05", "subject": "Biokimia", "topic": "Protein", "difficulty": "Mudah", "stem": "Struktur primer protein ditentukan oleh…", "options": ["Pola lipatan alfa-heliks dan beta-sheet", "Urutan asam amino yang dihubungkan ikatan peptida", "Susunan ruang beberapa rantai polipeptida", "Ikatan hidrogen antarrantai samping"], "answerIndex": 1, "explanation": "Struktur primer adalah urutan linear asam amino dalam rantai polipeptida yang disambung ikatan peptida; urutan ini ditentukan oleh gen dan menentukan semua tingkat struktur di atasnya. Alfa-heliks dan beta-sheet adalah struktur sekunder, susunan ruang satu rantai adalah struktur tersier, dan gabungan beberapa subunit adalah struktur kuartener.", "keyPoint": "Primer = urutan asam amino (ikatan peptida).", "source": "bank"}, {"id": 30, "code": "BK-06", "subject": "Biokimia", "topic": "Protein", "difficulty": "Sedang", "stem": "Denaturasi protein oleh panas atau pH ekstrem pada dasarnya merusak…", "options": ["Ikatan peptida pada struktur primer", "Struktur sekunder, tersier, dan kuartener tanpa memutus ikatan peptida", "Urutan asam amino penyusun protein", "Kode genetik yang menyandi protein"], "answerIndex": 1, "explanation": "Denaturasi mengganggu interaksi lemah (ikatan hidrogen, interaksi hidrofobik, jembatan garam) yang mempertahankan lipatan protein, sehingga struktur sekunder–kuartener terbuka dan protein kehilangan aktivitas biologisnya. Urutan asam amino (struktur primer) tetap utuh karena ikatan peptida adalah ikatan kovalen yang kuat; contoh sehari-hari adalah putih telur yang memutih saat dimasak.", "keyPoint": "Denaturasi merusak lipatan, bukan urutan asam amino.", "source": "bank"}, {"id": 31, "code": "MB-01", "subject": "Mikrobiologi Farmasi", "topic": "Bakteriologi", "difficulty": "Mudah", "stem": "Pada pewarnaan Gram, bakteri Gram positif tampak ungu karena…", "options": ["Dinding selnya tipis sehingga mudah menyerap safranin", "Lapisan peptidoglikan yang tebal menahan kompleks kristal violet–iodin saat dicuci alkohol", "Membran luarnya mengikat kristal violet secara permanen", "Sitoplasmanya bersifat sangat asam"], "answerIndex": 1, "explanation": "Bakteri Gram positif memiliki peptidoglikan tebal yang mengalami dehidrasi oleh alkohol sehingga pori-porinya menutup dan kompleks kristal violet–iodin tertahan di dalam sel; sel tetap ungu. Bakteri Gram negatif berpeptidoglikan tipis dan bermembran luar lipid yang larut oleh alkohol, sehingga warna ungu lepas dan sel mengambil warna lawan safranin menjadi merah muda.", "keyPoint": "Gram positif: peptidoglikan tebal menahan kristal violet.", "source": "bank"}, {"id": 32, "code": "MB-02", "subject": "Mikrobiologi Farmasi", "topic": "Sterilisasi", "difficulty": "Mudah", "stem": "Sterilisasi dengan autoklaf (panas lembab bertekanan) umumnya dilakukan pada kondisi…", "options": ["100 °C selama 30 menit", "121 °C selama 15 menit pada tekanan ±15 psi", "160 °C selama 2 jam", "60 °C selama 30 menit"], "answerIndex": 1, "explanation": "Autoklaf memakai uap jenuh bertekanan: kondisi baku 121 °C, tekanan sekitar 15 psi (1 atm di atas tekanan atmosfer), selama 15–20 menit — cukup untuk membunuh bakteri vegetatif dan sporanya. Suhu 160–170 °C selama 1–2 jam adalah sterilisasi panas kering (oven), sedangkan 60 °C hanya pasteurisasi yang tidak steril.", "keyPoint": "Autoklaf: 121 °C, 15 menit, uap bertekanan.", "source": "bank"}, {"id": 33, "code": "MB-03", "subject": "Mikrobiologi Farmasi", "topic": "Bakteriologi", "difficulty": "Sedang", "stem": "Endotoksin bakteri adalah…", "options": ["Protein yang disekresikan bakteri Gram positif dan labil terhadap panas", "Lipopolisakarida (LPS) pada membran luar bakteri Gram negatif yang relatif tahan panas", "Enzim yang merusak dinding sel inang", "Toksin yang hanya dihasilkan oleh virus"], "answerIndex": 1, "explanation": "Endotoksin adalah lipopolisakarida (LPS), bagian struktural membran luar bakteri Gram negatif yang terlepas saat sel lisis; bagian lipid A-nya menimbulkan demam (pirogen) dan relatif tahan panas sehingga tidak hilang hanya dengan sterilisasi biasa — perlu depirogenasi (misalnya panas kering 250 °C). Sebaliknya eksotoksin adalah protein yang disekresikan (banyak oleh Gram positif) dan umumnya labil terhadap panas.", "keyPoint": "Endotoksin = LPS Gram negatif, pirogen, tahan panas.", "source": "bank"}, {"id": 34, "code": "MB-04", "subject": "Mikrobiologi Farmasi", "topic": "Uji Sterilitas", "difficulty": "Sulit", "stem": "Pada uji sterilitas menurut Farmakope, Fluid Thioglycollate Medium (FTM) terutama digunakan untuk menumbuhkan…", "options": ["Jamur dan kapang aerob", "Bakteri anaerob dan bakteri aerob", "Virus dan mikoplasma", "Hanya bakteri pembentuk spora"], "answerIndex": 1, "explanation": "Uji sterilitas memakai dua media: Fluid Thioglycollate Medium yang mendukung pertumbuhan bakteri anaerob (di bagian bawah tabung yang miskin oksigen) sekaligus bakteri aerob (di permukaan), dan Soybean-Casein Digest Medium terutama untuk jamur serta bakteri aerob. Keduanya diinkubasi 14 hari dan diamati kekeruhannya.", "keyPoint": "FTM → bakteri anaerob + aerob; SCDM → jamur + bakteri aerob.", "source": "bank"}, {"id": 35, "code": "MB-05", "subject": "Mikrobiologi Farmasi", "topic": "Bakteriologi", "difficulty": "Mudah", "stem": "Bakteri berbentuk kokus (bulat) yang tersusun bergerombol seperti buah anggur adalah ciri genus…", "options": ["Streptococcus", "Staphylococcus", "Neisseria", "Bacillus"], "answerIndex": 1, "explanation": "Staphylococcus membelah pada beberapa bidang sehingga sel-selnya tersusun bergerombol tidak teratur menyerupai tandan anggur. Streptococcus membelah pada satu bidang membentuk rantai, Neisseria berbentuk diplokokus, dan Bacillus adalah batang (basil) pembentuk spora.", "keyPoint": "Kokus bergerombol = Staphylococcus.", "source": "bank"}, {"id": 36, "code": "MB-06", "subject": "Mikrobiologi Farmasi", "topic": "Antibiotik", "difficulty": "Sedang", "stem": "Antibiotik golongan penisilin bersifat bakterisidal karena mekanisme kerjanya…", "options": ["Menghambat sintesis protein pada ribosom 30S", "Menghambat sintesis dinding sel bakteri (mengikat PBP)", "Merusak membran sel jamur", "Menghambat sintesis asam folat"], "answerIndex": 1, "explanation": "Penisilin dan betalaktam lain mengikat penicillin-binding proteins (PBP) dan menghambat tahap transpeptidasi pembentukan peptidoglikan. Dinding sel yang cacat membuat bakteri lisis oleh tekanan osmotik, sehingga efeknya bakterisidal terutama pada bakteri yang sedang tumbuh. Penghambatan ribosom 30S adalah mekanisme aminoglikosida/tetrasiklin, dan penghambatan folat adalah sulfonamida.", "keyPoint": "Penisilin: hambat dinding sel → bakterisidal.", "source": "bank"}, {"id": 37, "code": "FG-01", "subject": "Farmakognosi", "topic": "Metabolit Sekunder", "difficulty": "Mudah", "stem": "Ciri khas senyawa golongan alkaloid adalah…", "options": ["Mengandung nitrogen dan umumnya bersifat basa", "Selalu berbentuk glikosida gula", "Merupakan polimer fenol yang larut lemak", "Tidak memberikan efek farmakologi apa pun"], "answerIndex": 0, "explanation": "Alkaloid adalah metabolit sekunder yang mengandung satu atau lebih atom nitrogen (umumnya dalam cincin heterosiklik) dan bersifat basa, sehingga membentuk garam dengan asam. Banyak yang beraktivitas farmakologi kuat, contohnya morfin, atropin, kafein, dan kinin.", "keyPoint": "Alkaloid: mengandung N, bersifat basa.", "source": "bank"}, {"id": 38, "code": "FG-02", "subject": "Farmakognosi", "topic": "Identifikasi Senyawa", "difficulty": "Sedang", "stem": "Pereaksi Dragendorff digunakan untuk identifikasi alkaloid dan memberikan hasil positif berupa…", "options": ["Warna biru tua dengan FeCl3", "Endapan berwarna jingga/oranye", "Busa yang stabil saat dikocok", "Warna merah dengan asam sulfat pekat"], "answerIndex": 1, "explanation": "Dragendorff (kalium iodobismutat) membentuk endapan jingga sampai coklat kemerahan dengan alkaloid, dan juga dipakai sebagai pereaksi semprot pada KLT. Warna biru-hitam dengan FeCl3 menunjukkan tanin/fenol, sedangkan busa stabil adalah uji saponin.", "keyPoint": "Dragendorff + alkaloid → endapan jingga.", "source": "bank"}, {"id": 39, "code": "FG-03", "subject": "Farmakognosi", "topic": "Metabolit Sekunder", "difficulty": "Sedang", "stem": "Tanin dapat dikenali dari sifat dan reaksinya, yaitu…", "options": ["Bersifat astringen dan memberi warna biru-hitam atau hijau dengan FeCl3", "Mudah menguap dan berbau khas aromatik", "Berasa manis dan membentuk busa stabil", "Larut sempurna dalam minyak dan tidak larut air"], "answerIndex": 0, "explanation": "Tanin adalah senyawa polifenol yang bersifat astringen (mengerutkan jaringan) karena mampu mengendapkan protein — dasar pemanfaatannya sebagai antidiare dan obat kumur. Dengan larutan FeCl3, tanin terhidrolisis memberi warna biru-hitam dan tanin terkondensasi memberi warna hijau kecoklatan. Sifat mudah menguap adalah ciri minyak atsiri, dan busa stabil adalah ciri saponin.", "keyPoint": "Tanin: astringen, + FeCl3 → biru-hitam/hijau.", "source": "bank"}, {"id": 40, "code": "FG-04", "subject": "Farmakognosi", "topic": "Simplisia", "difficulty": "Mudah", "stem": "Pengertian simplisia menurut Farmakope Herbal Indonesia adalah…", "options": ["Bahan alam yang telah diekstraksi dengan pelarut organik", "Bahan alam yang belum mengalami pengolahan apa pun kecuali pengeringan, digunakan untuk pengobatan", "Sediaan jadi berupa jamu yang telah terdaftar", "Senyawa murni hasil isolasi dari tanaman"], "answerIndex": 1, "explanation": "Simplisia adalah bahan alam (nabati, hewani, atau mineral) yang belum mengalami pengolahan apa pun selain pengeringan, dan digunakan untuk tujuan pengobatan. Simplisia nabati dapat berupa tanaman utuh, bagian tanaman, atau eksudat. Bila sudah diekstraksi, hasilnya disebut ekstrak, bukan simplisia lagi.", "keyPoint": "Simplisia = bahan alam, hanya dikeringkan.", "source": "bank"}, {"id": 41, "code": "FG-05", "subject": "Farmakognosi", "topic": "Metabolit Sekunder", "difficulty": "Sedang", "stem": "Digoksin, glikosida jantung yang dipakai untuk gagal jantung, diperoleh dari tanaman…", "options": ["Papaver somniferum", "Digitalis lanata / Digitalis purpurea", "Cinchona succirubra", "Atropa belladonna"], "answerIndex": 1, "explanation": "Digoksin adalah glikosida kardiak dari daun Digitalis lanata (dan Digitalis purpurea) yang bekerja menghambat pompa Na⁺/K⁺-ATPase sehingga meningkatkan kontraktilitas jantung. Papaver somniferum adalah sumber morfin, Cinchona sumber kinin, dan Atropa belladonna sumber atropin.", "keyPoint": "Digoksin ← Digitalis (glikosida jantung).", "source": "bank"}, {"id": 42, "code": "FG-06", "subject": "Farmakognosi", "topic": "Metabolit Sekunder", "difficulty": "Mudah", "stem": "Minyak atsiri (minyak eteris) umumnya diperoleh dari simplisia dengan cara…", "options": ["Maserasi dengan etanol 70%", "Destilasi (penyulingan) uap atau air", "Perkolasi dengan eter", "Pengeringan beku (freeze drying)"], "answerIndex": 1, "explanation": "Minyak atsiri adalah campuran senyawa mudah menguap pembawa aroma khas tanaman. Karena sifatnya yang ikut terbawa uap air, metode baku perolehannya adalah destilasi air, destilasi uap, atau destilasi air–uap. Maserasi/perkolasi menghasilkan ekstrak yang masih mengandung banyak komponen tidak menguap.", "keyPoint": "Minyak atsiri didapat lewat destilasi uap/air.", "source": "bank"}, {"id": 43, "code": "FF-01", "subject": "Farmasi Fisika", "topic": "Kelarutan", "difficulty": "Mudah", "stem": "Prinsip \"like dissolves like\" dalam kelarutan berarti…", "options": ["Semua zat larut dalam air bila diaduk cukup lama", "Zat polar cenderung larut dalam pelarut polar, zat nonpolar dalam pelarut nonpolar", "Kelarutan selalu naik dengan kenaikan suhu", "Zat dengan titik leleh tinggi selalu lebih mudah larut"], "answerIndex": 1, "explanation": "Kelarutan terbesar terjadi bila gaya antarmolekul zat terlarut dan pelarut mirip: senyawa polar/ionik larut baik dalam pelarut polar seperti air, sedangkan senyawa nonpolar larut dalam pelarut nonpolar seperti minyak atau heksana. Kenaikan suhu tidak selalu menaikkan kelarutan (beberapa zat justru turun), dan titik leleh tinggi umumnya malah menurunkan kelarutan.", "keyPoint": "Polar larut di polar; nonpolar di nonpolar.", "source": "bank"}, {"id": 44, "code": "FF-02", "subject": "Farmasi Fisika", "topic": "Reologi", "difficulty": "Sedang", "stem": "Sistem aliran pseudoplastis (shear thinning) menunjukkan perilaku…", "options": ["Viskositas tetap berapa pun laju gesernya", "Viskositas menurun bila laju geser (pengadukan) meningkat", "Viskositas meningkat bila laju geser meningkat", "Tidak mengalir sampai tegangan tertentu terlampaui, lalu viskositas naik"], "answerIndex": 1, "explanation": "Pada sistem pseudoplastis — khas larutan polimer dan banyak suspensi/emulsi farmasi — molekul yang semula acak akan mensejajarkan diri searah aliran saat digeser, sehingga tahanan alir turun: viskositas tampak menurun dengan naiknya laju geser. Viskositas tetap adalah aliran Newtonian, viskositas naik saat digeser adalah aliran dilatan, dan adanya yield value adalah ciri aliran plastis.", "keyPoint": "Pseudoplastis: digeser makin kencang → makin encer.", "source": "bank"}, {"id": 45, "code": "FF-03", "subject": "Farmasi Fisika", "topic": "Disolusi", "difficulty": "Sedang", "stem": "Menurut persamaan Noyes–Whitney, memperkecil ukuran partikel zat aktif akan mempercepat laju disolusi karena…", "options": ["Kelarutan jenuh zat menjadi berlipat ganda", "Luas permukaan partikel yang kontak dengan medium meningkat", "Koefisien difusi zat berubah menjadi nol", "Tebal lapisan difusi menjadi semakin besar"], "answerIndex": 1, "explanation": "Persamaan Noyes–Whitney: dC/dt = (D·A/h)(Cs − C). Laju disolusi sebanding dengan luas permukaan A. Memperkecil ukuran partikel (misalnya mikronisasi) sangat menaikkan luas permukaan per satuan massa, sehingga disolusi lebih cepat — strategi klasik untuk obat sukar larut. Tebal lapisan difusi h yang lebih besar justru memperlambat disolusi.", "keyPoint": "Partikel lebih kecil → luas permukaan ↑ → disolusi ↑.", "source": "bank"}, {"id": 46, "code": "FF-04", "subject": "Farmasi Fisika", "topic": "Surfaktan", "difficulty": "Sedang", "stem": "Nilai HLB (hydrophile–lipophile balance) surfaktan yang tinggi (±8–18) menunjukkan surfaktan tersebut cocok sebagai…", "options": ["Pembentuk emulsi tipe A/M (air dalam minyak)", "Pembentuk emulsi tipe M/A (minyak dalam air) dan bahan pembasah/pelarut", "Antifoam (pencegah busa)", "Pengawet sediaan steril"], "answerIndex": 1, "explanation": "Skala HLB 0–20 menunjukkan keseimbangan sifat hidrofil–lipofil surfaktan. HLB rendah (3–6) bersifat lipofil dan cocok untuk emulsi A/M, sedangkan HLB tinggi (8–18) bersifat hidrofil sehingga menstabilkan emulsi M/A serta berfungsi sebagai pembasah dan pelarut (solubilizer pada HLB 15–18). Contoh surfaktan HLB tinggi adalah Tween (polisorbat).", "keyPoint": "HLB tinggi → emulsi M/A; HLB rendah → A/M.", "source": "bank"}, {"id": 47, "code": "FF-05", "subject": "Farmasi Fisika", "topic": "Emulsi", "difficulty": "Sedang", "stem": "Uji identifikasi tipe emulsi dengan metode pengenceran didasarkan pada prinsip bahwa emulsi…", "options": ["Hanya dapat diencerkan dengan fase luarnya (fase kontinu)", "Selalu berubah warna bila ditambah air", "Mengendap bila ditambah fase dalamnya", "Tidak dapat diencerkan dengan cairan apa pun"], "answerIndex": 0, "explanation": "Fase kontinu (fase luar) menentukan cairan pengencer yang dapat bercampur dengan emulsi. Emulsi M/A (fase luar air) dapat diencerkan dengan air tetapi tidak dengan minyak; sebaliknya emulsi A/M hanya dapat diencerkan dengan minyak. Prinsip yang sama mendasari uji konduktivitas (M/A menghantar listrik) dan uji pewarnaan dengan zat warna larut air/larut minyak.", "keyPoint": "Emulsi bisa diencerkan hanya dengan fase luarnya.", "source": "bank"}, {"id": 48, "code": "FF-06", "subject": "Farmasi Fisika", "topic": "Surfaktan", "difficulty": "Sulit", "stem": "Konsentrasi misel kritis (CMC) adalah konsentrasi surfaktan di mana…", "options": ["Surfaktan mulai mengendap dari larutan", "Surfaktan mulai membentuk misel dan tegangan permukaan menjadi hampir tetap", "Larutan surfaktan mencapai titik didihnya", "Semua molekul air telah terikat surfaktan"], "answerIndex": 1, "explanation": "Di bawah CMC, molekul surfaktan berada sebagai monomer dan menempati antarmuka sehingga tegangan permukaan turun tajam seiring konsentrasi. Pada CMC antarmuka jenuh dan molekul tambahan mulai beragregasi membentuk misel di dalam larutan; akibatnya tegangan permukaan hampir tidak turun lagi, dan sifat solubilisasi (melarutkan zat sukar larut di inti misel) mulai muncul.", "keyPoint": "CMC = titik mulai terbentuk misel.", "source": "bank"}, {"id": 49, "code": "FK-09", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Konversi Dosis Hewan Uji", "difficulty": "Sedang", "stem": "Dalam praktikum farmakologi eksperimental, dosis untuk hewan uji dikonversi dari dosis manusia berdasarkan luas permukaan tubuh. Menurut tabel konversi yang lazim dipakai, faktor konversi dosis manusia (70 kg) untuk tikus putih 200 g adalah…", "options": ["0,0026", "0,018", "0,14", "1,00"], "answerIndex": 1, "explanation": "Konversi dosis antarspesies tidak cukup memakai perbandingan bobot badan, karena laju metabolisme berkaitan dengan luas permukaan tubuh. Pada tabel konversi yang lazim dipakai di praktikum (Laurence & Bacharach), dosis total manusia 70 kg dikalikan 0,018 untuk tikus 200 g dan 0,0026 untuk mencit 20 g. Nilai 0,14 adalah faktor untuk kelinci 1,5 kg.", "keyPoint": "Konversi manusia 70 kg → tikus 200 g: × 0,018.", "source": "bank"}, {"id": 50, "code": "FK-10", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Metode Uji Eksperimental", "difficulty": "Sedang", "stem": "Pada uji aktivitas analgesik metode geliat (writhing test), mencit diinduksi asam asetat secara intraperitoneal. Parameter yang diamati untuk menilai efek analgesik adalah…", "options": ["Waktu mencit bertahan di atas pelat panas (hot plate)", "Jumlah geliat (regangan perut dan kaki) dalam waktu pengamatan tertentu", "Volume edema pada telapak kaki mencit", "Lamanya waktu tidur yang diinduksi pentobarbital"], "answerIndex": 1, "explanation": "Asam asetat menimbulkan nyeri viseral yang membuat mencit menggeliat: perut menempel ke lantai, badan meregang, dan kaki belakang menjangkau ke belakang. Zat analgesik menurunkan jumlah geliat dibanding kontrol, dan persentase proteksinya dihitung dari penurunan itu. Waktu di pelat panas adalah parameter metode hot plate (analgesik sentral), volume edema untuk uji antiinflamasi, dan waktu tidur untuk uji sedatif-hipnotik.", "keyPoint": "Writhing test: hitung jumlah geliat setelah asam asetat i.p.", "source": "bank"}, {"id": 51, "code": "FK-11", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Metode Uji Eksperimental", "difficulty": "Sedang", "stem": "Uji aktivitas antiinflamasi in vivo yang klasik dilakukan dengan menginduksi edema pada telapak kaki tikus menggunakan karagenan. Volume edema diukur dengan alat…", "options": ["Pletismometer", "Rotarod", "Spirometer", "Osmometer"], "answerIndex": 0, "explanation": "Karagenan yang disuntikkan ke telapak kaki tikus menimbulkan edema akut yang berkembang dalam beberapa jam. Perubahan volume kaki diukur dengan pletismometer (berdasarkan perpindahan volume cairan) sebelum dan sesudah induksi, lalu persentase hambatan edema oleh obat uji dibandingkan dengan kontrol. Rotarod menilai koordinasi motorik, spirometer fungsi paru, dan osmometer tekanan osmotik.", "keyPoint": "Edema karagenan → volume kaki diukur pletismometer.", "source": "bank"}, {"id": 52, "code": "FK-12", "subject": "Farmakologi dan Toksikologi Eksperimental I (FAF221302)", "topic": "Toksikologi", "difficulty": "Sulit", "stem": "LD50 (dosis letal median) dalam uji toksisitas akut didefinisikan sebagai…", "options": ["Dosis terkecil yang mulai menimbulkan efek terapi pada hewan uji", "Dosis tunggal suatu zat yang secara statistik mematikan 50% hewan uji dalam masa pengamatan", "Dosis harian maksimum yang masih aman dipakai seumur hidup", "Dosis yang menimbulkan efek toksik pada 50% hewan uji tanpa menyebabkan kematian"], "answerIndex": 1, "explanation": "LD50 adalah dosis tunggal yang diperkirakan mematikan separuh populasi hewan uji, ditentukan dari kurva hubungan dosis–kematian selama masa pengamatan (umumnya sampai 14 hari) dan menjadi dasar klasifikasi toksisitas akut suatu zat. Dosis yang menimbulkan efek toksik pada 50% hewan adalah TD50, sedangkan dosis efektif median adalah ED50 — ketiganya dipakai menghitung indeks terapi.", "keyPoint": "LD50 = dosis tunggal yang mematikan 50% hewan uji.", "source": "bank"}, {"id": 53, "code": "FSP-09", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Evaluasi Granul", "difficulty": "Sedang", "stem": "Sifat alir granul dinilai dari sudut diam (angle of repose). Granul dengan sudut diam sekitar 30° menunjukkan…", "options": ["Sifat alir sangat buruk, granul tidak dapat dicetak", "Sifat alir baik", "Granul terlalu basah dan lengket", "Ukuran granul terlalu halus untuk dicetak"], "answerIndex": 1, "explanation": "Sudut diam adalah sudut antara permukaan kerucut tumpukan granul dan bidang datar; semakin mudah granul mengalir, semakin landai tumpukannya. Sebagai patokan, sudut 25–45° menunjukkan sifat alir baik sampai cukup, sedangkan sudut di atas ±50° menandakan aliran buruk yang berisiko menyebabkan variasi bobot tablet. Sifat alir juga dapat dinilai dari kecepatan alir dan indeks kompresibilitas (Carr).", "keyPoint": "Sudut diam 25–45° = aliran granul baik.", "source": "bank"}, {"id": 54, "code": "FSP-10", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Evaluasi Tablet", "difficulty": "Sulit", "stem": "Uji keseragaman bobot untuk tablet dengan bobot rata-rata lebih dari 300 mg menurut Farmakope (penyimpangan kolom A = 5%, kolom B = 10%) dinyatakan memenuhi syarat apabila…", "options": ["Semua tablet harus tepat sama bobotnya dengan bobot rata-rata", "Tidak lebih dari 2 tablet menyimpang melebihi kolom A dan tidak satu pun menyimpang melebihi kolom B", "Tidak lebih dari 5 tablet menyimpang melebihi kolom B", "Cukup 10 tablet ditimbang dan semuanya masuk kolom B"], "answerIndex": 1, "explanation": "Uji keseragaman bobot dilakukan pada 20 tablet. Persentase penyimpangan terhadap bobot rata-rata diatur dalam dua kolom: untuk bobot rata-rata > 300 mg, kolom A = 5% dan kolom B = 10%. Syaratnya: tidak lebih dari 2 tablet yang penyimpangannya melebihi kolom A, dan tidak boleh ada satu tablet pun yang menyimpang melebihi kolom B. Untuk bobot rata-rata 151–300 mg, kolom A = 7,5% dan kolom B = 15%.", "keyPoint": "Keseragaman bobot: maks 2 tablet lewat kolom A, nol lewat kolom B.", "source": "bank"}, {"id": 55, "code": "FSP-11", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Uji Disolusi", "difficulty": "Sedang", "stem": "Pada uji disolusi menurut Farmakope, alat tipe 2 adalah alat dengan pengaduk berbentuk…", "options": ["Keranjang (basket)", "Dayung (paddle)", "Silinder bolak-balik", "Cakram berputar"], "answerIndex": 1, "explanation": "Farmakope mengenal beberapa tipe alat disolusi: tipe 1 keranjang berputar (basket), tipe 2 dayung (paddle) — keduanya paling sering dipakai untuk tablet dan kapsul — tipe 3 silinder bolak-balik, dan tipe 4 sel alir (flow-through cell). Pada tipe 2, tablet dibiarkan tenggelam di dasar bejana dan medium diaduk oleh dayung pada kecepatan tertentu, umumnya 50–100 rpm.", "keyPoint": "Disolusi tipe 1 = keranjang; tipe 2 = dayung.", "source": "bank"}, {"id": 56, "code": "FSP-12", "subject": "Formulasi Teknologi Sediaan Padat (FAF221305)", "topic": "Evaluasi Tablet", "difficulty": "Mudah", "stem": "Uji kekerasan tablet (hardness test) bertujuan menilai…", "options": ["Kecepatan tablet melepaskan zat aktif dalam medium", "Ketahanan tablet terhadap tekanan dan goncangan mekanik selama penanganan", "Keseragaman kadar zat aktif antartablet", "Kemampuan tablet menyerap air dari udara"], "answerIndex": 1, "explanation": "Kekerasan tablet diukur dengan hardness tester: gaya (umumnya dinyatakan dalam kg) yang dibutuhkan untuk memecahkan tablet secara diametral. Tablet yang terlalu lunak mudah remuk saat pengemasan dan distribusi, sedangkan tablet terlalu keras dapat gagal hancur dan disolusi. Kekerasan tablet konvensional umumnya berkisar 4–8 kg. Kecepatan pelepasan zat aktif dinilai dengan uji disolusi, bukan uji kekerasan.", "keyPoint": "Kekerasan = ketahanan mekanik tablet (umumnya 4–8 kg).", "source": "bank"}, {"id": 57, "code": "KA-09", "subject": "Kimia Analisis II (FAF221307)", "topic": "Standarisasi Larutan", "difficulty": "Sedang", "stem": "Larutan NaOH harus dibakukan (distandarisasi) sebelum dipakai sebagai titran karena NaOH bukan bahan baku standar primer. Bahan yang lazim dipakai untuk membakukan NaOH adalah…", "options": ["Natrium karbonat anhidrat", "Kalium hidrogen ftalat (KHP)", "Asam klorida pekat", "Natrium tiosulfat"], "answerIndex": 1, "explanation": "NaOH bersifat higroskopis dan menyerap CO₂ dari udara sehingga kadarnya tidak pasti — ia larutan standar sekunder yang harus dibakukan. Kalium hidrogen ftalat (KHP) memenuhi syarat bahan baku standar primer: kemurnian tinggi, stabil, tidak higroskopis, dan berat molekulnya besar (204,22) sehingga kesalahan timbang relatif kecil. Natrium karbonat anhidrat adalah standar primer untuk membakukan asam (HCl), bukan basa.", "keyPoint": "Bakukan NaOH dengan KHP (standar primer).", "source": "bank"}, {"id": 58, "code": "KA-10", "subject": "Kimia Analisis II (FAF221307)", "topic": "Argentometri", "difficulty": "Sedang", "stem": "Penetapan kadar klorida dengan metode Mohr menggunakan titran AgNO₃ dan indikator kalium kromat (K₂CrO₄). Titik akhir titrasi ditandai oleh…", "options": ["Hilangnya warna ungu larutan", "Terbentuknya endapan merah bata perak kromat (Ag₂CrO₄)", "Timbulnya warna biru karena kompleks amilum–iod", "Perubahan warna fenolftalein menjadi merah muda"], "answerIndex": 1, "explanation": "Selama titrasi, Ag⁺ terlebih dahulu mengendapkan Cl⁻ sebagai AgCl putih karena kelarutannya lebih kecil. Setelah seluruh klorida habis, kelebihan Ag⁺ pertama bereaksi dengan indikator kromat membentuk Ag₂CrO₄ yang berwarna merah bata — tanda titik akhir. Metode Mohr harus berlangsung pada pH sekitar 6,5–9: terlalu asam kromat berubah menjadi dikromat, terlalu basa Ag⁺ mengendap sebagai Ag₂O.", "keyPoint": "Mohr: titik akhir = endapan Ag₂CrO₄ merah bata.", "source": "bank"}, {"id": 59, "code": "KA-11", "subject": "Kimia Analisis II (FAF221307)", "topic": "Iodometri", "difficulty": "Sedang", "stem": "Pada titrasi iodometri, indikator amilum sebaiknya ditambahkan…", "options": ["Sejak awal titrasi bersamaan dengan analit", "Menjelang titik akhir, saat warna larutan sudah kuning pucat", "Setelah titik akhir tercapai untuk memastikan hasil", "Tidak perlu ditambahkan karena iod sudah berwarna"], "answerIndex": 1, "explanation": "Amilum membentuk kompleks biru tua dengan iod. Bila ditambahkan sejak awal saat konsentrasi iod masih tinggi, kompleks amilum–iod yang terbentuk sangat kuat dan sukar terurai sehingga titik akhir menjadi lambat dan tidak tajam. Karena itu amilum ditambahkan ketika sebagian besar iod sudah tertitrasi (warna kuning pucat); titik akhir tercapai saat warna biru tepat hilang.", "keyPoint": "Amilum ditambahkan menjelang titik akhir iodometri.", "source": "bank"}, {"id": 60, "code": "KA-12", "subject": "Kimia Analisis II (FAF221307)", "topic": "Titrasi Redoks", "difficulty": "Sulit", "stem": "Titrasi permanganometri dilakukan dalam suasana asam menggunakan H₂SO₄ encer, bukan HCl. Alasannya adalah…", "options": ["HCl membuat larutan terlalu berwarna untuk diamati", "Ion klorida dapat dioksidasi oleh KMnO₄ menjadi gas klor sehingga konsumsi titran berlebih", "H₂SO₄ berfungsi sebagai indikator titik akhir", "KMnO₄ tidak larut dalam larutan yang mengandung HCl"], "answerIndex": 1, "explanation": "KMnO₄ adalah oksidator kuat; dalam suasana asam klorida, ion Cl⁻ ikut teroksidasi menjadi Cl₂ sehingga volume KMnO₄ yang terpakai lebih besar dari yang seharusnya dan hasil penetapan menjadi terlalu tinggi. H₂SO₄ encer dipilih karena sulfat tidak dioksidasi permanganat. KMnO₄ sekaligus bertindak sebagai autoindikator: titik akhir ditandai warna merah muda samar yang bertahan ±30 detik.", "keyPoint": "Permanganometri pakai H₂SO₄ — Cl⁻ bisa dioksidasi KMnO₄.", "source": "bank"}];

      const LETTERS = ["A", "B", "C", "D", "E"];
      const COUNTS = [5, 10, 15, 20];
      const SUBJECT_ICONS = {
        "Farmakologi dan Toksikologi Eksperimental I (FAF221302)": "💊",
        "Formulasi Teknologi Sediaan Padat (FAF221305)": "🧪",
        "Kimia Analisis II (FAF221307)": "⚗️",
        "Biokimia": "🧬",
        "Mikrobiologi Farmasi": "🦠",
        "Farmakognosi": "🌿",
        "Farmasi Fisika": "🔬",
      };
      function subjectIcon(name) { return SUBJECT_ICONS[name] || "📘"; }

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }

      /* ---------- Penyimpanan lokal (versi statis: tersimpan di browser ini) ---------- */
      const LS_KEY = "bank-soal-farmasi-s3-statis-v1";
      function loadStore() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && typeof p === "object") {
              return {
                extra: Array.isArray(p.extra) ? p.extra : [],
                attempts: p.attempts && typeof p.attempts === "object" ? p.attempts : {},
                bookmarks: Array.isArray(p.bookmarks) ? p.bookmarks : [],
                history: Array.isArray(p.history) ? p.history : [],
                nextId: typeof p.nextId === "number" ? p.nextId : 1000,
              };
            }
          }
        } catch (e) { /* penyimpanan tidak tersedia: jalan tanpa simpan */ }
        return { extra: [], attempts: {}, bookmarks: [], history: [], nextId: 1000 };
      }
      const store = loadStore();
      function saveStore() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* abaikan */ }
      }

      function allQuestions() {
        return SEED.concat(store.extra);
      }
      function questionById(id) {
        const all = allQuestions();
        for (let i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
        return null;
      }
      function subjectsOf() {
        const map = new Map();
        for (const q of allQuestions()) {
          if (!map.has(q.subject)) map.set(q.subject, { name: q.subject, topics: new Set(), total: 0 });
          const e = map.get(q.subject);
          e.topics.add(q.topic); e.total += 1;
        }
        return Array.from(map.values()).map((e) => ({
          name: e.name, topics: Array.from(e.topics).sort(), total: e.total,
        }));
      }
      function computeStats() {
        let totalAnswered = 0, totalCorrect = 0;
        const perSubjectMap = new Map();
        const wrongIds = [];
        for (const key of Object.keys(store.attempts)) {
          const a = store.attempts[key];
          const q = questionById(Number(key));
          if (!q || !a || !a.n) continue;
          totalAnswered += a.n; totalCorrect += a.c;
          const e = perSubjectMap.get(q.subject) || { answered: 0, correct: 0 };
          e.answered += a.n; e.correct += a.c;
          perSubjectMap.set(q.subject, e);
          if (!a.lastCorrect) wrongIds.push(q.id);
        }
        const finished = store.history;
        const last = finished[0];
        return {
          totalAnswered, totalCorrect,
          accuracy: totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0,
          perSubject: perSubjectMap,
          wrongIds,
          sessionsDone: finished.length,
          lastScore: last && last.total > 0 ? Math.round((last.correct / last.total) * 100) : null,
        };
      }
      function recordAttempt(qid, correct) {
        const a = store.attempts[qid] || { n: 0, c: 0, lastCorrect: false };
        a.n += 1; if (correct) a.c += 1; a.lastCorrect = !!correct;
        store.attempts[qid] = a;
        saveStore();
      }
      function isBookmarked(id) { return store.bookmarks.indexOf(id) >= 0; }
      function toggleBookmark(id) {
        const i = store.bookmarks.indexOf(id);
        if (i >= 0) store.bookmarks.splice(i, 1); else store.bookmarks.push(id);
        saveStore();
      }
      function feedbackFor(q, chosen) {
        return {
          correct: chosen === q.answerIndex,
          answerIndex: q.answerIndex,
          explanation: q.explanation,
          keyPoint: q.keyPoint,
        };
      }

      function render() {

      /* ================= BERANDA ================= */

        h += "<h1>Mau latihan apa<br />hari ini?</h1>";

        h += '<section aria-label="Ringkasan progres belajar" class="statgrid">';

        if (stats.wrongIds.length > 0) {

        }

        h += '<section aria-label="Atur sesi latihan" class="mt6"><h2>Mulai sesi latihan</h2>';
        h += '<p class="mt3 small" style="font-weight:600;color:var(--dim)">Mata kuliah</p><div class="pillrow subjects">';
        const names = ["Campuran"].concat(subjects.map((s) => s.name));
        for (const name of names) {
          h += '<button type="button" class="pill" data-subject="' + esc(name) + '" aria-pressed="' +
            (sel.subject === name) + '">' +

        h += '<label class="subject-select"><span class="sr-only">Mata kuliah</span>' +

        h += '<section aria-label="Progres per mata kuliah" class="mt8"><h2>Progres per mata kuliah</h2><div class="stack mt3">';

              ' <span class="xs dim" style="font-weight:500">(' + (hs.total > 0 ? Math.round((hs.correct / hs.total) * 100) : 0) + "%)</span></p></div>";

        h += '<section class="tools" aria-label="Berkas versi statis"><h2>Pakai di mana saja</h2>' +
          '<p class="small dim mt1">Halaman ini satu berkas HTML utuh — unduh lalu unggah ke Vercel atau GitHub Pages untuk membukanya dari perangkat mana pun. Progres belajar tersimpan di browser perangkat yang kamu pakai.</p>' +
          '<div class="row">' +
          '<button type="button" class="btn" id="btn-download">⬇ Unduh berkas HTML ini</button>' +

        h += footerHTML();

        app.querySelectorAll("[data-subject]").forEach((b) =>
          b.addEventListener("click", () => { sel.subject = b.getAttribute("data-subject"); renderBeranda(); }));

        if (selMobile) selMobile.addEventListener("change", (e) => { sel.subject = e.target.value; renderBeranda(); });
        app.querySelectorAll("[data-count]").forEach((b) =>
          b.addEventListener("click", () => { sel.count = Number(b.getAttribute("data-count")); renderBeranda(); }));
        app.querySelectorAll("[data-mode]").forEach((b) =>
          b.addEventListener("click", () => { sel.mode = b.getAttribute("data-mode"); renderBeranda(); }));
        const bw = document.getElementById("btn-wrong");
        if (bw) bw.addEventListener("click", startWrongSession);
        document.getElementById("btn-start").addEventListener("click", startSetupSession);
        document.getElementById("btn-download").addEventListener("click", downloadSelf);
