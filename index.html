      function startSession(mode, label, ids) {
        session = {
          ids: ids, index: 0, mode: mode, label: label,
          answers: {}, feedback: {}, done: false, finalCorrect: 0,
        };
        sessionError = "";
        view = "sesi";
        render();
      }
      function startSetupSession() {
        setupError = "";
        const pool = sel.subject === "Campuran"
          ? allQuestions()
          : allQuestions().filter((q) => q.subject === sel.subject);
        if (pool.length === 0) {
          setupError = "Belum ada soal untuk pilihan ini.";
          renderBeranda();
          return;
        }
        const ids = shuffle(pool.map((q) => q.id)).slice(0, Math.min(sel.count, pool.length));
        startSession(sel.mode, sel.subject, ids);
      }
      function startWrongSession() {
        const stats = computeStats();
        const ids = stats.wrongIds.filter((id) => questionById(id));
        if (ids.length === 0) return;
        startSession("langsung", "Ulangi yang Salah", shuffle(ids));
      }
      function startSingle(q) { startSession("langsung", q.subject, [q.id]); }

      function downloadSelf() {
        const html = "<!doctype html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "bank-soal-farmasi-semester-3.html";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      function exportJSON() {
        const data = allQuestions().map((q) => ({
          kode: q.code, mataKuliah: q.subject, topik: q.topic, kesulitan: q.difficulty,
          soal: q.stem, pilihan: q.options, kunciIndex: q.answerIndex,
          pembahasan: q.explanation, inti: q.keyPoint, sumber: q.source,
        }));
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "bank-soal-farmasi-semester-3.json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      /* ================= BANK SOAL ================= */
      function filteredQuestions() {
        const stats = computeStats();
        const wrongSet = new Set(stats.wrongIds);
        const needle = filt.search.trim().toLowerCase();
        return allQuestions().filter((q) => {
          if (filt.subject !== "Semua" && q.subject !== filt.subject) return false;
          if (filt.topic !== "Semua" && q.topic !== filt.topic) return false;
          if (filt.difficulty !== "Semua" && q.difficulty !== filt.difficulty) return false;
          const att = store.attempts[q.id];
          if (filt.status === "Belum dijawab" && att && att.n > 0) return false;
          if (filt.status === "Pernah salah" && !wrongSet.has(q.id)) return false;
          if (filt.status === "Ditandai" && !isBookmarked(q.id)) return false;
          if (needle && (q.stem + " " + q.topic + " " + q.subject + " " + q.code).toLowerCase().indexOf(needle) < 0) return false;
          return true;
        });
      }
      function bankListHTML() {
        const list = filteredQuestions();
        if (list.length === 0) {
          return '<div class="empty"><p style="font-size:1.875rem" aria-hidden="true">🗂️</p>' +
            '<p class="mt2" style="font-weight:600">Tidak ada soal yang cocok dengan filter ini</p>' +
            '<p class="mt1 small dim">Coba longgarkan filter atau kata kuncinya — atau buat soal baru di tab Tambah Soal.</p></div>';
        }
        let h = '<div class="stack mt4">';
        for (const q of list) {
          const open = expandedId === q.id;
          const att = store.attempts[q.id];
          h += '<article class="card qcard"><button type="button" class="qhead" data-expand="' + q.id +
            '" aria-expanded="' + open + '"><span class="chips">' +
            chip(q.code) + chip(q.subject) + chip(q.topic) + chip(q.difficulty, diffTone(q.difficulty)) +
            (q.source === "ai" ? chip("AI", "amber") : "") +
            (q.source === "tambah sendiri" ? chip("Buatanmu", "amber") : "") +
            (isBookmarked(q.id) ? '<span aria-label="Ditandai">🔖</span>' : "") +
            (att && att.n > 0 ? '<span class="xs dim" style="margin-left:auto">' + att.c + "/" + att.n + " benar</span>" : "") +
            '</span><span class="qstem">' + esc(q.stem) + "</span></button>";
          if (open) {
            h += '<div class="qbody"><ol class="optlist">';
            q.options.forEach((opt, i) => {
              h += '<li class="' + (i === q.answerIndex ? "key" : "") + '"><strong>' + LETTERS[i] + ".</strong> " +
                esc(opt) + (i === q.answerIndex ? " ✓ kunci" : "") + "</li>";
            });
            h += "</ol>" + explainHTML(q);
            h += '<div class="qactions">' +
              '<button type="button" class="btn btn-accent" data-practice="' + q.id + '">▶ Latihan soal ini</button>' +
              '<button type="button" class="btn" data-bookmark="' + q.id + '" aria-pressed="' + isBookmarked(q.id) + '">' +
              (isBookmarked(q.id) ? "🔖 Hapus tanda" : "🔖 Tandai") + "</button>" +
              (q.source !== "bank"
                ? '<button type="button" class="btn btn-danger-o" data-delete="' + q.id + '">🗑 Hapus</button>'
                : "") +
              "</div></div>";
          }
          h += "</article>";
        }
        h += "</div>";
        return h;
      }
      function bindBankList() {
        const list = document.getElementById("bank-list");
        if (!list) return;
        list.querySelectorAll("[data-expand]").forEach((b) =>
          b.addEventListener("click", () => {
            const id = Number(b.getAttribute("data-expand"));
            expandedId = expandedId === id ? null : id;
            refreshBankList();
          }));
        list.querySelectorAll("[data-practice]").forEach((b) =>
          b.addEventListener("click", () => {
            const q = questionById(Number(b.getAttribute("data-practice")));
            if (q) startSingle(q);
          }));
        list.querySelectorAll("[data-bookmark]").forEach((b) =>
          b.addEventListener("click", () => {
            toggleBookmark(Number(b.getAttribute("data-bookmark")));
            refreshBankList();
          }));
        list.querySelectorAll("[data-delete]").forEach((b) =>
          b.addEventListener("click", () => {
            const id = Number(b.getAttribute("data-delete"));
            store.extra = store.extra.filter((q) => q.id !== id);
            delete store.attempts[id];
            store.bookmarks = store.bookmarks.filter((x) => x !== id);
            if (expandedId === id) expandedId = null;
            bankMsg = "Soal berhasil dihapus.";
            saveStore();
            renderBank();
          }));
      }
      function refreshBankList() {
        const list = document.getElementById("bank-list");
        const count = document.getElementById("bank-count");
        if (!list) return;
        list.innerHTML = bankListHTML();
        if (count) {
          count.textContent = filteredQuestions().length + " dari " + allQuestions().length +
            " soal. Ketuk soal untuk melihat kunci & pembahasannya.";

      }
      function renderBank() {
        const subjects = subjectsOf();
        const topics = filt.subject === "Semua"
          ? Array.from(new Set(allQuestions().map((q) => q.topic))).sort()
          : (subjects.find((s) => s.name === filt.subject) || { topics: [] }).topics;
        const selCls = "field";
        let h = '<h1 class="page">Bank Soal</h1>';

        h += '<label class="mt4" style="display:block"><span class="sr-only">Cari soal</span>' +
          '<input type="search" id="f-search" class="field" placeholder="🔍 Cari kata kunci, topik, atau kode soal…" value="' +
          esc(filt.search) + '" /></label>';
        h += '<div class="filtergrid">';
        h += '<label><span class="sr-only">Filter mata kuliah</span><select id="f-subject" class="' + selCls + '">' +
          '<option value="Semua">Semua mapel</option>' +
          subjects.map((s) => '<option value="' + esc(s.name) + '"' + (filt.subject === s.name ? " selected" : "") + ">" + esc(s.name) + "</option>").join("") +
          "</select></label>";
        h += '<label><span class="sr-only">Filter topik</span><select id="f-topic" class="' + selCls + '">' +
          '<option value="Semua">Semua topik</option>' +
          topics.map((t) => '<option value="' + esc(t) + '"' + (filt.topic === t ? " selected" : "") + ">" + esc(t) + "</option>").join("") +
          "</select></label>";
        h += '<label><span class="sr-only">Filter tingkat kesulitan</span><select id="f-difficulty" class="' + selCls + '">' +
          ["Semua", "Mudah", "Sedang", "Sulit"].map((d) =>
            '<option value="' + (d === "Semua" ? "Semua" : d) + '"' + (filt.difficulty === d ? " selected" : "") + ">" +
            (d === "Semua" ? "Semua level" : d) + "</option>").join("") +
          "</select></label>";
        h += '<label><span class="sr-only">Filter status pengerjaan</span><select id="f-status" class="' + selCls + '">' +
          ["Semua", "Belum dijawab", "Pernah salah", "Ditandai"].map((s) =>
            '<option value="' + s + '"' + (filt.status === s ? " selected" : "") + ">" +
            (s === "Semua" ? "Semua status" : s === "Pernah salah" ? "Terakhir salah" : s) + "</option>").join("") +
          "</select></label>";
        h += "</div>";

        h += '<div id="bank-list">' + bankListHTML() + "</div>";
        h += footerHTML();
        app.innerHTML = h;

        const count = document.getElementById("bank-count");
        count.textContent = filteredQuestions().length + " dari " + allQuestions().length +
          " soal. Ketuk soal untuk melihat kunci & pembahasannya.";
        document.getElementById("f-search").addEventListener("input", (e) => {
          filt.search = e.target.value; refreshBankList();
        });
        document.getElementById("f-subject").addEventListener("change", (e) => {
          filt.subject = e.target.value; filt.topic = "Semua"; renderBank();
        });
        document.getElementById("f-topic").addEventListener("change", (e) => {
          filt.topic = e.target.value; refreshBankList();
        });
        document.getElementById("f-difficulty").addEventListener("change", (e) => {
          filt.difficulty = e.target.value; refreshBankList();
        });
        document.getElementById("f-status").addEventListener("change", (e) => {
          filt.status = e.target.value; refreshBankList();
        });
        bindBankList();
      }

      /* ================= SESI LATIHAN ================= */
      function chooseAnswer(q, idx) {
        if (!session || session.done) return;
        if (session.mode === "ujian") {
          session.answers[q.id] = idx;
          renderSesi();
          return;
        }
        if (session.feedback[q.id]) return;
        sessionError = "";
        session.answers[q.id] = idx;
        const fb = feedbackFor(q, idx);
        session.feedback[q.id] = fb;
        recordAttempt(q.id, fb.correct);
        renderSesi();
      }
      function finishSession() {
        if (!session) return;
        let correct = 0;
        if (session.mode === "ujian") {
          for (const qid of session.ids) {
            const chosen = session.answers[qid];
            const q = questionById(qid);
            if (chosen === undefined || !q) continue;
            const fb = feedbackFor(q, chosen);
            session.feedback[qid] = fb;
            recordAttempt(qid, fb.correct);
            if (fb.correct) correct += 1;
          }
        } else {
          correct = session.ids.filter((id) => session.feedback[id] && session.feedback[id].correct).length;
        }
        session.done = true;
        session.finalCorrect = correct;
        store.history.unshift({
          mode: session.mode, subject: session.label,
          total: session.ids.length, correct: correct,
          finishedAt: new Date().toISOString(),
        });
        store.history = store.history.slice(0, 30);
        saveStore();
        renderSesi();
      }
      function renderSesi() {
        const s = session;
        if (!s) { view = "beranda"; renderBeranda(); return; }
        const total = s.ids.length;

        if (s.done) {
          const pct = total > 0 ? Math.round((s.finalCorrect / total) * 100) : 0;
          let h = '<p class="small dim" style="font-weight:500">' + esc(s.label) + "</p>";
          h += '<h1 class="page">Hasil sesi</h1>';
          h += '<div class="card result"><p class="pct">' + pct + "%</p>" +
            '<p class="mt1" style="font-weight:600">' + s.finalCorrect + " dari " + total + " soal benar</p>" +
            '<p class="mt1 small dim">' +
            (pct >= 80 ? "Mantap — konsepnya sudah kuat. Naikkan level kesulitannya."
              : pct >= 50 ? "Lumayan. Baca lagi pembahasan soal yang salah di bawah ini."
              : "Tidak apa-apa — justru di sinilah belajarnya. Pelajari pembahasan tiap soal di bawah.") +
            '</p><div class="qactions" style="justify-content:center">' +
            '<button type="button" class="btn btn-accent" id="btn-restart" style="padding:0.625rem 1rem;font-weight:700">🔁 Ulangi sesi</button>' +
            '<button type="button" class="btn" id="btn-exit" style="padding:0.625rem 1rem">Kembali ke Beranda</button>' +
            "</div></div>";
          h += '<h2 class="mt6">Bedah tiap soal</h2><div class="stack mt3">';
          s.ids.forEach((qid, i) => {
            const q = questionById(qid);
            if (!q) return;
            const fb = s.feedback[qid];
            const chosen = s.answers[qid];
            h += '<article class="card bedah"><p class="chips">' +
              chip("Soal " + (i + 1)) + chip(q.subject) +
              (fb ? chip(fb.correct ? "✓ Benar" : "✗ Salah", fb.correct ? "ok" : "danger")
                  : chip("Tidak dijawab", "amber")) +
              '</p><p class="stem">' + esc(q.stem) + "</p>" +
              '<p class="mt2 small">Jawabanmu: <strong>' +
              (chosen !== undefined ? LETTERS[chosen] + ". " + esc(q.options[chosen] || "") : "—") + "</strong></p>" +
              '<p class="small">Kunci: <strong>' + LETTERS[q.answerIndex] + ". " + esc(q.options[q.answerIndex] || "") + "</strong></p>" +
              explainHTML(q) + "</article>";
          });
          h += "</div>" + footerHTML();
          app.innerHTML = h;
          document.getElementById("btn-restart").addEventListener("click", () => {
            startSession(s.mode, s.label, shuffle(s.ids));
          });
          document.getElementById("btn-exit").addEventListener("click", exitSession);
          window.scrollTo(0, 0);
          return;
        }

        const q = questionById(s.ids[s.index]);
        if (!q) {
          app.innerHTML = '<div style="padding:4rem 0;text-align:center"><p style="font-weight:600">Soal sesi ini tidak ditemukan.</p>' +
            '<button type="button" class="btn btn-accent mt4" id="btn-exit2" style="font-weight:700">Kembali ke Beranda</button></div>';
          document.getElementById("btn-exit2").addEventListener("click", exitSession);
          return;
        }
        const fb = s.feedback[q.id];
        const chosen = s.answers[q.id];
        const isLast = s.index === total - 1;
        const answeredCount = s.mode === "ujian"
          ? Object.keys(s.answers).length
          : Object.keys(s.feedback).length;
        const canNext = s.mode === "ujian" ? true : fb !== undefined;
        const progressPct = Math.round(((s.index + 1) / total) * 100);

        let h = '<div class="sesshead"><div><p style="font-weight:600">' + esc(s.label) + "</p>" +
          '<p class="xs dim">' + (s.mode === "ujian" ? "📝 Mode ujian" : "⚡ Mode langsung") +
          " · Soal " + (s.index + 1) + " dari " + total + "</p></div>" +
          '<button type="button" class="btn" id="btn-exit" aria-label="Keluar dari sesi" style="padding:0.5rem 0.75rem">✕ Keluar</button></div>';
        h += '<div class="bar" role="progressbar" aria-valuenow="' + progressPct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Kemajuan sesi"><div style="width:' + progressPct + '%"></div></div>';

        h += '<article class="card qbig"><div class="chips">' +
          '<span style="font-size:1.25rem" aria-hidden="true">' + esc(subjectIcon(q.subject)) + "</span>" +
          chip(q.subject) + chip(q.topic) + chip(q.difficulty, diffTone(q.difficulty)) +
          (q.source === "ai" ? chip("Soal AI", "amber") : "") +
          (q.source === "tambah sendiri" ? chip("Buatanmu", "amber") : "") +
          '<button type="button" id="btn-bm" aria-pressed="' + isBookmarked(q.id) + '" aria-label="' +
          (isBookmarked(q.id) ? "Hapus tanda soal ini" : "Tandai soal ini") +
          '" style="margin-left:auto;border:1px solid var(--border);background:var(--surface);border-radius:0.5rem;padding:0.375rem 0.625rem;font-size:0.875rem">' +
          (isBookmarked(q.id) ? "🔖" : "🏷️") + "</button></div>";
        h += "<h2>" + esc(q.stem) + '</h2><div role="group" aria-label="Pilihan jawaban">';
        q.options.forEach((opt, i) => {
          const isKey = fb !== undefined && i === q.answerIndex;
          const isChosen = chosen === i;
          const isWrong = fb !== undefined && isChosen && !fb.correct;
          let cls = "optbtn";
          if (isKey) cls += " key"; else if (isWrong) cls += " wrong"; else if (isChosen) cls += " sel";
          h += '<button type="button" class="' + cls + '" data-opt="' + i + '"' +
            (fb !== undefined ? " disabled" : "") + ' aria-pressed="' + isChosen + '">' +
            '<span class="letter">' + LETTERS[i] + '</span><span class="txt">' + esc(opt) + "</span>" +
            (isKey ? '<span class="mark" style="color:var(--ok)" aria-label="Jawaban benar">✓</span>' : "") +
            (isWrong ? '<span class="mark" style="color:var(--danger)" aria-label="Jawabanmu salah">✗</span>' : "") +
            "</button>";
        });
        h += "</div>";
        if (fb) {
          h += '<div class="feedback ' + (fb.correct ? "ok" : "bad") + '" role="status">' +
            '<p class="verdict ' + (fb.correct ? "ok" : "bad") + '">' + (fb.correct ? "✓ Benar!" : "✗ Kurang tepat") + "</p>" +
            (!fb.correct

      /* ================= GENERATOR SOAL (pola hitungan) =================

      function ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function fmtNum(x) {
        let v = Math.round(x * 1000) / 1000;
        let s = String(v);
        if (s.indexOf("e") >= 0 || s.indexOf("E") >= 0) {
          s = v.toExponential(2).replace("e", " × 10^");
        }
        return s.replace(".", ",");
      }
      function numOptions(correct, distractors, unit) {
        const vals = [correct];
        for (const d of distractors) {
          const v = Math.round(d * 1000) / 1000;
          if (v > 0 && vals.every((x) => Math.abs(x - v) > 1e-9)) vals.push(v);
          if (vals.length >= 4) break;
        }
        let k = 2;
        while (vals.length < 4) {
          const v = Math.round(correct * (1 + 0.37 * k) * 1000) / 1000;
          if (v > 0 && vals.every((x) => Math.abs(x - v) > 1e-9)) vals.push(v);
          k++;
        }
        const order = shuffle(vals.map((v, i) => i));
        const options = order.map((i) => fmtNum(vals[i]) + (unit ? " " + unit : ""));
        return { options: options, answerIndex: order.indexOf(0) };
      }
      const SUP = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
      function sup(n) { return String(n).split("").map((c) => SUP[c] || c).join(""); }

      function generateLocal(subject, topic, count) {
        let pool = TEMPLATES.filter((t) => t.subjects.indexOf(subject) >= 0);
        if (pool.length === 0) pool = TEMPLATES;
        const made = [];
        const used = new Set();
        for (let i = 0; i < count; i++) {
          let tpl = pickOne(pool);
          let guard = 0;
          while (used.has(tpl) && guard < 10) { tpl = pickOne(pool); guard++; }
          used.add(tpl);
          const g = tpl.make();
          made.push({
            id: store.nextId++,
            code: "GEN-" + (store.nextId - 1),
            subject: subject,
            topic: (topic && topic.trim()) || g.topic,
            difficulty: g.difficulty,
            stem: g.stem, options: g.options, answerIndex: g.answerIndex,
            explanation: g.explanation, keyPoint: g.keyPoint,
            source: "ai",
          });
        }
        return made;
      }

      function saveOwnQuestion() {

        if (!subject) form.error = "Isi dulu mata kuliahnya.";
        else if (!topic) form.error = "Isi dulu topiknya.";
        else if (stem.length < 10) form.error = "Soalnya terlalu pendek — minimal 10 karakter.";
        else if (options.some((o) => o.length === 0)) form.error = "Keempat pilihan jawaban harus terisi semua.";
        else if (explanation.length < 10) form.error = "Pembahasannya terlalu pendek — minimal 10 karakter.";
        else if (keyPoint.length < 3) form.error = "Isi inti hafalannya (minimal 3 karakter).";
        if (form.error) { renderTambah(); return; }
        const id = store.nextId++;
        store.extra.push({
          id: id, code: "SND-" + id, subject: subject, topic: topic,
          difficulty: form.difficulty, stem: stem, options: options,
          answerIndex: form.answer, explanation: explanation, keyPoint: keyPoint,
          source: "tambah sendiri",
        });
        saveStore();
        form.stem = ""; form.options = ["", "", "", ""]; form.answer = 0;
        form.explanation = ""; form.keyPoint = "";
        form.ok = "Soalmu tersimpan di bank soal. Cek di tab Bank Soal ya.";
        renderTambah();
      }

      /* ================= NAVIGASI & MULAI ================= */
      tabbar.querySelectorAll("[data-nav]").forEach((b) =>
        b.addEventListener("click", () => {
          view = b.getAttribute("data-nav");
          bankMsg = "";
          render();
        }));
      render();
    </script>
  </body>
</html>
